name: Testar leitura do link (passo de configuracao)

on:
  workflow_dispatch: {}

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Abrir o link, ler hoje e guardar captura de tela
        env:
          PBI_PUBLIC_URL: ${{ secrets.PBI_PUBLIC_URL }}
        run: python -m generator.probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostico
          path: probe/
